# 3. AI Feature 1 – Vector Search (Tourism Discovery)

Purpose:
Allow semantic search for tourism locations rather than simple keyword matching.

Example user query:
"Find wildlife parks near Nairobi with hiking"

The system converts the query into embeddings and retrieves the most semantically similar tourism destinations.

Technology

* LangChain
* FAISS vector database
* Sentence Transformers

Python Dependencies

pip install fastapi uvicorn langchain faiss-cpu sentence-transformers

vector_search.py

from langchain.embeddings import HuggingFaceEmbeddings
from langchain.vectorstores import FAISS

documents = [
"Masai Mara National Reserve famous for wildebeest migration",
"Diani Beach known for white sand beaches",
"Mount Kenya National Park popular for hiking",
"Nairobi National Park wildlife near city"
]

embeddings = HuggingFaceEmbeddings()

db = FAISS.from_texts(documents, embeddings)

def search(query):
results = db.similarity_search(query, k=3)
return [r.page_content for r in results]

API endpoint

GET /search?query=<user_query>

Response

{
"results":[
"Mount Kenya National Park popular for hiking",
"Nairobi National Park wildlife near city"
]
}

