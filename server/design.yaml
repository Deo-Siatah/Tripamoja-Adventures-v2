# 4. AI Feature 2 – Dynamic Tourist Pooling

Purpose:
Automatically group tourists traveling to the same destination to share logistics resources such as vehicles or guides.

Inputs

* Tourist location
* Destination
* Date

AI logic clusters tourists by proximity.

Example

Tourist A (Nairobi)
Tourist B (Nairobi)
Tourist C (Maasai Mara)

Result

Pool 1
Tourist A
Tourist B

Pool 2
Tourist C

Dependencies

pip install scikit-learn numpy

pooling.py

from sklearn.cluster import KMeans
import numpy as np

def pool_tourists(tourists):

```
coords = np.array([[t["lat"], t["lng"]] for t in tourists])

kmeans = KMeans(n_clusters=2)

labels = kmeans.fit_predict(coords)

pools = {}

for i, label in enumerate(labels):
    pools.setdefault(label, []).append(tourists[i])

return pools
```

API Endpoint

POST /pool

Input

{
"tourists":[
{"id":1,"lat":-1.292,"lng":36.821},
{"id":2,"lat":-1.291,"lng":36.820},
{"id":3,"lat":-3.386,"lng":35.563}
]
}

Output

{
"pools":{
"0":[tourist1,tourist2],
"1":[tourist3]
}
}

