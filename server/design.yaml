# 5. AI Feature 3 – Simulated Geofencing

Purpose:
Verify if a tourist has physically arrived at a destination.

This can later trigger:

* QR verification
* Smart contract release
* Booking confirmation

Example geofence zone

Maasai Mara Gate
Latitude: -1.493
Longitude: 35.143
Radius: 0.05

geofence.py

import math

def is_inside_geofence(user_lat, user_lng, zone):

```
distance = math.sqrt(
    (user_lat - zone["lat"])**2 +
    (user_lng - zone["lng"])**2
)

return distance < zone["radius"]
```

API Endpoint

POST /geofence

Input

{
"lat":-1.492,
"lng":35.142
}

Output

{
"inside":true
}

---

# 6. Python AI Service

Framework
FastAPI

main.py

from fastapi import FastAPI
from vector_search import search
from pooling import pool_tourists
from geofence import is_inside_geofence

app = FastAPI()

@app.get("/search")
def search_places(query: str):
return {"results": search(query)}

@app.post("/pool")
def pool(data: dict):
tourists = data["tourists"]
pools = pool_tourists(tourists)
return {"pools": pools}

@app.post("/geofence")
def check_geofence(data: dict):

```
zone = {
    "lat": -1.493,
    "lng": 35.143,
    "radius": 0.05
}

inside = is_inside_geofence(data["lat"], data["lng"], zone)

return {"inside": inside}
```

Run service

uvicorn main:app --reload --port 8000

