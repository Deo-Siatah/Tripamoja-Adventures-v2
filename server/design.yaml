# Tripamoja AI Backend – MVP Architecture Source of Truth

## Purpose

This document defines the **official architecture and implementation plan** for the AI backend used in the Tripamoja MVP.
The goal is to demonstrate key AI capabilities quickly and reliably for a demo or hackathon environment.

The MVP AI backend focuses on three core features:

1. Vector Search (semantic tourism discovery)
2. Dynamic Tourist Pooling (AI grouping for shared logistics)
3. Simulated Geofencing (location-based booking verification)

The system uses a **Node.js backend service** connected to a **Python AI microservice**.

