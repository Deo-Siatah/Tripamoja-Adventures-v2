# 7. Node.js Backend Integration

Purpose
Expose the AI service to the frontend.

Dependencies

npm install express axios

server.js

const express = require("express")
const axios = require("axios")

const app = express()

app.use(express.json())

const AI_SERVICE = "http://localhost:8000"

app.get("/ai/search", async (req,res)=>{

const r = await axios.get(`${AI_SERVICE}/search`,{
params:{query:req.query.q}
})

res.json(r.data)
})

app.post("/ai/pool", async (req,res)=>{

const r = await axios.post(`${AI_SERVICE}/pool`,req.body)

res.json(r.data)
})

app.post("/ai/geofence", async (req,res)=>{

const r = await axios.post(`${AI_SERVICE}/geofence`,req.body)

res.json(r.data)
})

app.listen(5000,()=>{
console.log("Node backend running")
})

